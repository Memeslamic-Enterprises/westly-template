<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ASSISTANT}}">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>{{ASSISTANT}}</title>
<style>
/* Graphite & Ember: a pocket instrument. Graphite hardware frames a cool paper screen; ember = "this wants you". */
:root{
  --bg:#eceef1; --surface:#fff; --surface-2:#f3f4f6; --surface-3:#e3e5e9;
  --ink:#101216; --ink-2:#4a505a; --ink-3:#626873;
  --line:rgba(16,18,22,.07); --line-2:rgba(16,18,22,.13);
  --hw:#15171b; --hw-hi:#1d2025; --hw-2:#2a2d33; --hw-ink:#f4f5f7; --hw-ink-2:#a3a9b3; --hw-ink-3:#9196a0; --hw-line:rgba(255,255,255,.08);
  --ember:#f0601f; --badge:#cf4a0e; --ember-ink:#b8420c; --ember-bg:#fcebe1; --on-ember:#fff;
  --you:#2d5be8; --you-hw:#93b0ff;
  --bad:#c82a1c; --bad-bg:#fbe7e4; --good:#15874a; --good-bg:#e2f3e9;
  --me:#2d5be8; --me-ink:#fff; --focus:#2d5be8;
  --good-hw:#4fd48c; --bad-hw:#ff7b6d;  /* status on the always-dark graphite cards, both modes */
  --sh-1:0 1px 2px rgba(16,18,22,.05),0 0 0 .5px rgba(16,18,22,.07);
  --sh-2:0 14px 34px -14px rgba(16,18,22,.32),0 2px 6px rgba(16,18,22,.05),0 0 0 .5px rgba(16,18,22,.06);
  --glass:rgba(236,238,241,.92); --dock:rgba(21,23,27,.94); --dock-line:rgba(255,255,255,.06);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter Display",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"DejaVu Sans Mono",Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --gut:16px; --col:640px; --r:22px;
  --dock-b:max(calc(var(--sab) - 8px),12px); --dock-h:62px;
  --tabspace:calc(var(--dock-h) + var(--dock-b) + 14px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --surface:#1a1b1f; --surface-2:#242529; --surface-3:#2e3035;
    --ink:#f3f4f6; --ink-2:#aeb3bc; --ink-3:#878c96;
    --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
    --hw:#000; --hw-hi:#1c1e23; --hw-2:#2c2f36; --hw-line:rgba(255,255,255,.07);
    --ember:#ff7a3d; --badge:#ff7a3d; --ember-ink:#ff9a68; --ember-bg:rgba(255,122,61,.12); --on-ember:#1c0b02;
    --you:#86a3ff;
    --bad:#ff7b6d; --bad-bg:rgba(255,123,109,.11); --good:#4fd48c; --good-bg:rgba(79,212,140,.1);
    --me:#3a62e6; --focus:#86a3ff;
    --sh-1:0 0 0 .5px rgba(255,255,255,.07);
    --sh-2:0 16px 36px -14px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.08);
    --glass:rgba(0,0,0,.82); --dock:rgba(28,30,35,.9); --dock-line:rgba(255,255,255,.09);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
.view,.msgs{scrollbar-width:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--hw);color:var(--ink);font:16px/1.4 var(--sans);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button,[role=button]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.press{transition:transform .22s var(--ease),background-color .15s,opacity .15s}
.press:active{transform:scale(.97);transition-duration:60ms}
.press.soft:active{transform:scale(.985)}

/* shell: graphite frame, paper screen */
#app{position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--app-h,100%);background:var(--hw)}
.dock,.chat-h,.nbar,.strip,.opts{-webkit-touch-callout:none}
main{position:absolute;left:0;right:0;top:var(--sat);bottom:0;background:var(--bg);overflow:hidden}
html.sa main{border-radius:18px 18px 0 0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;overflow-anchor:none;padding:0 calc(var(--gut) + var(--sar)) calc(var(--tabspace) + 28px) calc(var(--gut) + var(--sal));display:none}
.view.on{display:block}
main::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabspace) + 24px);background:linear-gradient(to top,var(--bg) var(--dock-b),transparent);pointer-events:none;z-index:7}
body[data-tab=chat] main::after,body.kb main::after{display:none}
body[data-tab=calendar] main::after{height:calc(var(--tabspace) + 92px);background:linear-gradient(to top,var(--bg) calc(var(--tabspace) + 64px),transparent)}
body.kb[data-tab=calendar] main::after{display:none}
.wrap{max-width:var(--col);margin:0 auto}

/* compact title that appears when a large title scrolls away */
.nbar{position:absolute;left:0;right:0;top:0;height:44px;z-index:8;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 .5px 0 var(--line-2);opacity:0;pointer-events:none;transition:opacity .18s}
.nbar.on{opacity:1;pointer-events:auto}
.nbar b{font:650 17px/1 var(--sans);letter-spacing:-.01em}
.netpill{position:absolute;bottom:calc(var(--tabspace) + 2px);left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);min-height:44px;padding:0 14px 0 11px;border-radius:18px;background:var(--hw);color:var(--hw-ink);font-size:13px;font-weight:600;box-shadow:var(--sh-2);white-space:nowrap;animation:drop .3s var(--ease)}
.netpill .ic{width:16px;height:16px;color:var(--ember)}
.netpill span{overflow:hidden;text-overflow:ellipsis}
.netpill u{text-decoration:none;color:var(--ember);margin-left:2px}
@keyframes drop{from{opacity:0;transform:translate(-50%,8px)}}
body.kb .netpill{display:none}
#ptr{position:absolute;top:10px;left:50%;margin-left:-16px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);z-index:1;opacity:0;pointer-events:none}
#ptr .ic{width:20px;height:20px}
#ptr.armed{color:var(--ink)}
#ptr.spin{opacity:1}
#ptr.spin .ic{animation:spin .8s linear infinite;color:var(--ink-2)}
@keyframes spin{to{transform:rotate(360deg)}}

/* dock (tab bar) */
.dock{position:absolute;left:0;right:0;bottom:var(--dock-b);z-index:10;display:flex;justify-content:center;padding:0 calc(12px + var(--sar)) 0 calc(12px + var(--sal));pointer-events:none}
.tabs{pointer-events:auto;position:relative;display:flex;width:100%;max-width:440px;height:var(--dock-h);padding:5px;border-radius:31px;background:var(--dock);-webkit-backdrop-filter:saturate(1.6) blur(24px);backdrop-filter:saturate(1.6) blur(24px);box-shadow:0 10px 24px -12px rgba(0,0,0,.35),0 0 0 .5px var(--dock-line),inset 0 .5px 0 rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){.tabs{box-shadow:0 18px 40px -16px rgba(0,0,0,.8),0 0 0 .5px var(--dock-line),inset 0 .5px 0 rgba(255,255,255,.08)}}
.tabs .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 5);border-radius:26px;background:rgba(255,255,255,.1);transition:transform .38s cubic-bezier(.3,1.25,.45,1)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:26px;color:var(--hw-ink-2);font-size:11px;font-weight:600;letter-spacing:0}
.tab .ic{width:23px;height:23px;transition:transform .2s var(--ease)}
.tab:active .ic{transform:scale(.86)}
.tab[aria-current=page]{color:#fff}
.tab[aria-current=page] .ic svg{stroke-width:2.1}
.badge{position:absolute;top:3px;left:50%;margin-left:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badge);color:var(--on-ember);font:700 11px/18px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--hw)}
body.kb .dock{display:none}

/* type */
.title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 14px}
h1{font:800 34px/1.04 var(--round);letter-spacing:-.025em;margin:0}
.sub{color:var(--ink-2);font-size:15px;margin-top:5px}
.sync{width:40px;height:40px;margin:-2px -4px 0 0;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);box-shadow:var(--sh-1);flex:none;position:relative}
.sync::after{content:"";position:absolute;inset:-4px}
.sync .ic{width:18px;height:18px}
.sync.busy .ic{animation:spin .8s linear infinite}
.label{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label b{font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}
.muted{color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}

/* hero: the instrument screen */
.hero{background:var(--hw);color:var(--hw-ink);border-radius:26px;padding:16px 16px 10px;box-shadow:var(--sh-2),inset 0 .5px 0 rgba(255,255,255,.08);position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(165deg,#26282e,#17181b 70%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.09),0 0 0 .5px rgba(255,255,255,.06)}}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,122,61,.16),transparent);pointer-events:none}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hw-ink-2)}
.eyebrow.now{color:var(--hw-ink)}
.wx{display:flex;align-items:center;gap:6px;color:var(--hw-ink);font-size:13px;font-weight:600}
.wx .ic{width:20px;height:20px;color:var(--hw-ink-2)}
.wx .ic.cool{color:var(--hw-ink-2)}
.wx .t{font:700 17px/1 var(--round);letter-spacing:-.01em}
.wx span:last-child{color:var(--hw-ink-2);font-weight:500}
.h-main{padding:12px 0 14px;min-height:92px}
.h-big{font:750 27px/1.1 var(--round);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.h-sub{color:var(--hw-ink-2);font-size:15px;margin-top:6px}
.who{display:grid;grid-template-columns:3px 68px 1fr;gap:0 10px;align-items:center;padding:4px 0}
.who+.who{margin-top:4px}
.who .bar{width:3px;height:26px;border-radius:2px;background:var(--hw-2)}
.who.you .bar{background:var(--you-hw)}
.who>div{min-width:0} .who .tm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .nm{font-size:13px;font-weight:600;color:var(--hw-ink-2)}
.who .tm{font:700 17px/1.2 var(--round);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.who.idle .tm{color:var(--hw-ink-2);font-weight:600}
.who .ds{font-size:13px;color:var(--hw-ink-2)}
.dial{position:relative;container-type:inline-size;margin:0 -8px;border-top:.5px solid var(--hw-line);padding-top:8px}
.strip{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(300cqw / 7);overscroll-behavior-x:contain;touch-action:pan-x;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.strip::-webkit-scrollbar{display:none}
.strip:focus-visible{outline:2px solid var(--hw-ink-2);outline-offset:2px}
.dial-mark{position:absolute;left:50%;bottom:-4px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--hw-ink-2);opacity:.6;pointer-events:none}
.evdot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--hw-ink-2)}
.day.unknown .dn{color:var(--hw-ink-2)}
.backtoday{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 12px 0 8px;border-radius:16px;background:var(--hw-2);color:var(--hw-ink);font:650 13px/1 var(--sans);position:relative}
.backtoday::after{content:"";position:absolute;inset:-6px -4px}
.backtoday .ic{width:14px;height:14px;transform:scaleX(-1)}
.dayempty{padding:16px;font-size:15px;color:var(--ink-2)}
.day{flex:0 0 calc(100cqw / 7);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:7px 0 8px;border-radius:14px;min-width:0;position:relative;color:var(--hw-ink)}
.day .dw{font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--hw-ink-3);text-transform:uppercase}
.day .dn{font:700 17px/1.15 var(--round);margin:4px 0 5px;letter-spacing:-.01em}
.day .st{font:600 10.5px/1.35 var(--mono);letter-spacing:-.04em;max-width:100%;padding:0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.you{color:var(--you-hw)}
.st.off,.st.none{color:var(--hw-ink-3);font-weight:500}
.day.today .dw{color:var(--hw-ink)}
.day[aria-pressed=true]{background:var(--hw-2)}

/* callouts */
.callout{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px 12px 12px;border-radius:20px;margin-top:10px;min-height:64px;background:var(--surface);box-shadow:var(--sh-1)}
.callout .ci{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.callout .ci .ic{width:21px;height:21px}
.callout .ct{flex:1;min-width:0}
.callout .ct b{display:block;font-size:15px;font-weight:650;letter-spacing:-.005em}
.callout .ct>span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.callout .chev{color:var(--ink-3);width:18px;height:18px;transition:transform .25s var(--ease)}
.c-needs .ci{background:var(--ember);color:var(--on-ember);box-shadow:0 6px 14px -6px var(--ember)}
.c-bad .ci{background:var(--bad-bg);color:var(--bad)}
.c-bad .chev{transform:rotate(90deg)}
.c-bad[aria-expanded=true] .chev{transform:rotate(-90deg)}
.hbox{margin-top:10px;border-radius:20px;overflow:hidden}
.hbox .callout{margin:0;box-shadow:none;background:none;border-radius:20px}
.probs{margin:0;padding:12px 16px 10px 64px;list-style:none;font-size:15px;color:var(--ink-2);position:relative}
.probs::before{content:"";position:absolute;left:64px;right:16px;top:0;border-top:.5px solid var(--line-2)}
.probs li{padding:3px 0;position:relative}
.probs li::before{content:"";position:absolute;left:-14px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.probs .askli::before{display:none}
.probs .ask{margin:8px 0 0 -2px;min-height:44px;font-weight:650;color:var(--you);display:inline-flex;align-items:center;gap:4px}

/* lists */
.rows>*+*{box-shadow:0 -.5px 0 var(--line-2)}
.ev{display:flex;gap:13px;align-items:center;padding:11px 14px;min-height:60px}
.chip-d{width:42px;flex:none;text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0 7px}
.chip-d .w{font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.chip-d .n{font:700 17px/1.1 var(--round);margin-top:3px}
.chip-d.now{background:var(--surface-3)} .chip-d.now .w{color:var(--ink-2)}
.ev .t{flex:1;min-width:0}
.ev .t b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.ev .t span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.ev .r{font:500 11px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.ch{display:flex;justify-content:space-between;gap:12px;padding:7px 16px;font-size:15px}
.ch span:last-child{font:500 11px/1.7 var(--mono);color:var(--ink-3);white-space:nowrap}
.ch .late{color:var(--bad)!important}

/* markdown */
.md{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.md p{margin:0 0 .6em}
.md>:last-child{margin-bottom:0}
.md ul{margin:0 0 .6em;padding-left:1.15em}
.md li{margin:.15em 0}
.md li::marker{color:var(--ink-3)}
.md code{font:13px/1.3 var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:6px}
.md a{color:var(--you);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.md .host{font:500 11px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.md strong{font-weight:650}
.md .h{font-weight:700;font-size:15px;margin-top:.9em}
.md>.h:first-child{margin-top:0}
.md .tbl{overflow-x:auto;margin:0 0 .6em}
.md table{border-collapse:collapse;font-size:13px}
.md td{border-bottom:.5px solid var(--line-2);padding:5px 12px 5px 0;vertical-align:top}
.md tr:first-child td{font-weight:650;color:var(--ink-2)}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.clamp2>*{margin:0!important;display:inline}
.clamp2 ul{padding:0;list-style:none}
.fade{position:relative;max-height:var(--clamp,300px);overflow:hidden}
.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(to bottom,transparent,var(--surface));pointer-events:none}
.more{display:inline-flex;align-items:center;gap:3px;min-height:34px;font-size:13px;font-weight:650;color:var(--you);padding:0 2px;position:relative}
.more::after{content:"";position:absolute;inset:-5px -6px}
.more .ic{width:16px;height:16px;transition:transform .2s var(--ease)}
.more[aria-expanded=true] .ic{transform:rotate(180deg)}
.foot{display:flex;justify-content:center;align-items:center;gap:7px;margin:28px 0 4px;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.foot i{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}

/* needs */
.need{padding:14px 14px 14px 16px;margin-bottom:10px;position:relative;transition:opacity .2s}
.meta-r{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.nx{width:30px;height:30px;margin:-6px -8px -6px 0;border-radius:15px;display:grid;place-items:center;color:var(--ink-3);position:relative}
.nx::after{content:"";position:absolute;inset:-7px}
.nx .ic{width:16px;height:16px}
.nx:active{background:var(--surface-3)}
.archrow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;margin-top:6px;padding:0 16px;border-radius:18px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2);font-size:15px;font-weight:600}
.archrow .ic{width:16px;height:16px}
.sync .back,.backlink .back{transform:scaleX(-1)}
.archall{display:flex;justify-content:center;margin-top:6px}
.link.danger{min-height:44px;padding:0 14px;color:var(--bad);font-weight:650;font-size:15px}
.link.danger.armed{background:var(--bad-bg);border-radius:22px}
.need.arch h2{color:var(--ink-2)}
.need .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.03em;color:var(--ink-3);margin-bottom:9px;min-height:22px}

.empty{text-align:center;padding:64px 24px 40px;color:var(--ink-2)}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut));padding:6px var(--gut) 10px}

.chipb{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);box-shadow:var(--sh-1);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;position:relative}

.fi-t{font:500 11px/1 var(--mono);color:var(--ink-3)}
.xn{font:700 11px/1 var(--mono);padding:3px 5px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}

.fi .plain{display:block;width:calc(100% - 40px);text-align:left;line-height:1.45;-webkit-user-select:text;user-select:text}

.fi .more{margin:2px 0 -10px 38px}
.thumbs{display:flex;gap:10px;margin-right:-4px;flex:none}
.thumb{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3);position:relative;opacity:.75}
.thumb::after{content:"";position:absolute;inset:-5px}
.thumb .ic{width:17px;height:17px}

.thumb.dn[aria-pressed=true]{color:var(--ink);background:var(--surface-3)}

.k-brief{--k:#c66a00} .k-evening,.k-weekly{--k:#5458d8} .k-mail{--k:#2d5be8} .k-health,.k-finance{--k:#15874a}
.k-attn{--k:#c82a1c} .k-docs{--k:#0d7a70} .k-draft,.k-other{--k:#6a707b}
@media (prefers-color-scheme:dark){
  .k-brief{--k:#f5b24f} .k-evening,.k-weekly{--k:#a7a8ff} .k-mail{--k:#86a3ff} .k-health,.k-finance{--k:#4fd48c}
  .k-attn{--k:#ff7b6d} .k-docs{--k:#55d6c8} .k-draft,.k-other{--k:#aeb3bc}
}
.sentinel{display:flex;justify-content:center;align-items:center;gap:10px;min-height:64px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* tasks */
.task{display:flex;gap:12px;width:100%;text-align:left;padding:13px 16px;min-height:56px}
.task .bul{width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-top:8px;flex:none}

.task b{display:block;font-weight:600;font-size:15px;line-height:1.35;letter-spacing:-.005em}
.task .tm{font:500 11px/1 var(--mono);color:var(--ink-3);margin-top:6px;letter-spacing:.02em}
.task .tm .age{color:var(--ink-3)}
.task .md{margin-top:6px;font-size:15px;color:var(--ink-2);line-height:1.45}
.task[role=button]{cursor:pointer}
.dev .md{font-size:15px;color:var(--ink-2)}
.dev .md ul{padding-left:1em}
.dev .md li+li{margin-top:6px}

/* chat */
#v-chat{padding:0 0 var(--tabspace);flex-direction:column;overflow:hidden}
#v-chat.on{display:flex}
body.kb #v-chat{padding-bottom:0}
.chat-h{flex:none;min-height:64px;display:flex;align-items:center;gap:11px;padding:10px calc(var(--gut) + var(--sar)) 10px calc(var(--gut) + var(--sal));background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 .5px 0 var(--line-2);position:relative;z-index:2}
.chat-h .wrap{display:flex;align-items:center;gap:11px;width:100%}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--hw);color:var(--hw-ink);display:grid;place-items:center;position:relative;flex:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}

.avatar .ic{width:22px;height:22px}
.avatar .ic svg{stroke-width:2.6}
.pilot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2.5px var(--bg);display:none}
.chat-h.off .pilot{background:transparent;box-shadow:0 0 0 2.5px var(--bg),inset 0 0 0 2px var(--ink-3);animation:none!important}
.work.stalled .dots i{animation:none;opacity:.35;background:var(--ink-3)}
.opt.confirm{background:var(--ink);color:var(--bg);box-shadow:none}
.live .pilot{display:block;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 2.5px var(--bg),0 0 0 6px color-mix(in srgb,var(--good) 30%,transparent)}}
.chat-h b{display:block;font:700 17px/1.15 var(--round);letter-spacing:-.01em}
.chat-h small{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.chat-h .ch-t{flex:1;min-width:0}

.ch-retry{min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface);box-shadow:var(--sh-1);font-size:13px;font-weight:650;color:var(--you);flex:none}
.live small{color:var(--ink-2)}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:10px calc(var(--gut) + var(--sar)) 12px calc(var(--gut) + var(--sal))}

.bub.w{align-self:flex-start;background:var(--surface);box-shadow:var(--sh-1)}

.bub.err{background:var(--bad-bg);box-shadow:none;color:var(--ink)}
.bub.err .eh{font-weight:650;color:var(--bad);font-size:13px;margin-bottom:2px}
.bub.work{display:flex;flex-direction:column;gap:3px}
.work-h{display:flex;align-items:center;gap:10px;font-weight:550;font-size:15px}
.work small{color:var(--ink-3);font-size:13px}
.work .ic{width:16px;height:16px;color:var(--ink-3)}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.csep{align-self:center;font:600 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 4px}
.retry-l{color:var(--you);font-weight:650;font-size:13px;min-height:44px;padding:0 6px}
.unsure{align-self:flex-end;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;column-gap:4px;max-width:90%;margin-top:4px;font-size:13px;color:var(--bad);text-align:right}
.unsure span{padding:0 6px}
.composer{flex:none;padding:6px calc(var(--gut) + var(--sar)) 8px calc(var(--gut) + var(--sal))}
.composer .wrap{display:flex;gap:8px;align-items:flex-end}
.composer .field{border-radius:22px;background:var(--surface);box-shadow:var(--sh-2);padding:11px 18px}
.composer .field:focus{box-shadow:var(--sh-2),inset 0 0 0 1.5px var(--focus)}
.fab{width:44px;height:44px;border-radius:50%;background:var(--me);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -8px var(--me)}
.fab:disabled{background:var(--surface-3);color:var(--ink-3);box-shadow:none}
.fab .ic{width:20px;height:20px}
.fab .ic svg{stroke-width:2.4}
.chat-empty{text-align:center;padding:56px 20px 8px;color:var(--ink-2);font-size:15px}
.chat-empty .avatar{width:64px;height:64px;border-radius:20px;margin:0 auto 18px}
.chat-empty .avatar .ic{width:34px;height:34px}
.chat-empty .pilot{display:block;width:15px;height:15px;background:var(--good);right:-3px;bottom:-3px;box-shadow:0 0 0 3px var(--bg)}
.chat-empty b{display:block;color:var(--ink);font:750 27px/1.2 var(--round);letter-spacing:-.02em;margin-bottom:6px}
.sugg{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:22px}
.sugg button{min-height:44px;padding:0 18px;border-radius:22px;background:var(--surface);box-shadow:var(--sh-1);font-size:15px;font-weight:550;color:var(--ink)}

.skel{border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1);position:relative;overflow:hidden;margin-bottom:10px;padding:18px 16px}
.skel>i{display:block;height:11px;border-radius:6px;background:var(--surface-2);margin-bottom:11px}
.skel.hw{border-radius:26px}
@media (prefers-color-scheme:dark){.skel.hw{background:#17181c}}
.skel.hw>i{background:var(--hw-2);height:13px}
.skel .cells{position:absolute;left:12px;right:12px;bottom:14px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.skel .cells i{height:62px;border-radius:13px;background:var(--hw-2)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--surface-2) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel.hw{background:var(--hw)} .skel.hw::after{background-image:linear-gradient(100deg,transparent 30%,var(--hw-hi) 50%,transparent 70%)}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
.toast{position:fixed;left:calc(16px + var(--sal));right:calc(16px + var(--sar));margin:0 auto;bottom:calc(var(--tabspace) + 4px);z-index:30;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 6px 0 16px;border-radius:23px;background:var(--hw);color:var(--hw-ink);font-size:15px;font-weight:600;width:auto;max-width:408px;box-shadow:0 14px 34px -10px rgba(0,0,0,.5),0 0 0 .5px var(--dock-line);overflow:hidden;animation:rise .32s var(--ease)}
.toast.plain{padding-right:16px}
.toast.plain>span{text-align:center;white-space:normal;line-height:1.3;padding:11px 0}
.toast.plain{border-radius:20px}
.toast>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:12px 0}
.toast button{min-height:44px;margin:1px 0;padding:0 12px;border-radius:18px;color:var(--ember);font-weight:700;flex:none}
.toast button:active{background:rgba(255,255,255,.08)}
.toast i{position:absolute;left:18px;right:18px;bottom:6px;height:2px;border-radius:1px;opacity:.85;background:var(--ember);transform-origin:left;animation:drain linear forwards}
.toast.out{opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
body.kb .toast{bottom:12px!important}
body[data-tab=chat] .toast{bottom:calc(var(--tabspace) + 66px)}
body.net .toast{bottom:calc(var(--tabspace) + 50px)}
body.net[data-tab=chat] .toast{bottom:calc(var(--tabspace) + 66px)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes drain{to{transform:scaleX(0)}}
@media (prefers-color-scheme:dark){.toast,.netpill{background:var(--hw-2)}.toast{box-shadow:0 0 0 .5px rgba(255,255,255,.12),0 14px 34px -10px #000}}
body.net .view{padding-bottom:calc(var(--tabspace) + 60px)}
body[data-tab=chat] .netpill{display:none}
/* today tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:112px;padding:13px 14px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--sh-1);text-align:left;overflow:hidden}
.tile .tl{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tile .tv{font:750 27px/1.1 var(--round);letter-spacing:-.02em;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ts{font-size:13px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tile.hot .tv{color:var(--ember-ink)} .tile.bad .tv{color:var(--bad)}
.tile .tile-ic{position:absolute;top:11px;right:12px;width:22px;height:22px;color:var(--ink-3)}
button.wx{border-radius:12px;padding:4px 6px;margin:-4px -6px}
/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);transition:background .26s var(--ease)}
.sheet-wrap.on{background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:calc(100% - var(--sat) - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.45);transform:translateY(100%);transition:transform .3s var(--ease);outline:none;padding-bottom:var(--sab)}

.sheet-grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none}

.sheet-x::after{content:"";position:absolute;inset:-4px}

.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px calc(var(--gut) + var(--sar)) 24px calc(var(--gut) + var(--sal))}
.sh-title{font:750 22px/1.2 var(--round);letter-spacing:-.02em;margin:6px 44px 10px 0}
.sh-p{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0 0 10px}
.sh-p code{font:13px var(--mono);background:var(--surface-2);padding:2px 6px;border-radius:6px;color:var(--ink);overflow-wrap:anywhere}
.sheet-body .field{display:block;width:100%;max-height:none}

  window.addEventListener('resize', remeasure); window.addEventListener('orientationchange', remeasure);
  if (window.visualViewport) visualViewport.addEventListener('resize', remeasure);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { if (queued) commitQueued(true); if (dqueued) commitDismiss(true); if (delQueued) commitDelete(true); if (docQueued) commitDocRemove(true); return; }
    checkUpdate();
    if (Date.now() - lastRefresh > 20000) refresh();
  });
  window.addEventListener('pagehide', () => { if (queued) commitQueued(true); if (dqueued) commitDismiss(true); if (delQueued) commitDelete(true); if (docQueued) commitDocRemove(true); });
  setInterval(() => { updIdle(); if (document.visibilityState === 'visible' && !refreshing && Date.now() - lastRefresh > 58000) refresh(); }, 15000);
  window.addEventListener('online', () => refresh());
  setupPTR();
  checkUpdate();
  Object.keys(sent).forEach(watchSent);

  const want = location.hash.slice(1);
  const st = store.get('tab', 'today');
  try { show(isTab(want) ? want : isTab(st) ? st : 'today'); } catch (e) { store.set('tab', 'today'); show('today'); }
  if (cur !== 'today') { loadedAt.today = Date.now(); loadToday(); if (cur !== 'needs') { loadedAt.needs = Date.now(); loadNeeds(); } }
  if (cur !== 'chat') { loadedAt.chat = Date.now(); loadChat(); }
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {}); } catch {}
}
